name: Build BlubRoom for iOS

on:
  workflow_dispatch:

jobs:
  unity-build:
    name: Create iOS Xcode project
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build Unity iOS project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.2f1
          targetPlatform: iOS

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: BlubRoom-Xcode
          path: build/iOS

  make-ipa:
    name: Compile unsigned IPA
    needs: unity-build
    runs-on: macos-latest

    steps:
      - name: Download Xcode project
        uses: actions/download-artifact@v4
        with:
          name: BlubRoom-Xcode
          path: ios-project

      - name: Find and compile application
        working-directory: ios-project
        run: |
          echo "Searching for the Xcode project..."
          find . -maxdepth 5 \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) -print

          WORKSPACE=$(find . -name "*.xcworkspace" ! -name "project.xcworkspace" -print -quit)
          PROJECT=$(find . -name "Unity-iPhone.xcodeproj" -print -quit)

          if [ -n "$WORKSPACE" ]; then
            echo "Using workspace: $WORKSPACE"
            xcodebuild \
              -workspace "$WORKSPACE" \
              -scheme Unity-iPhone \
              -configuration Release \
              -sdk iphoneos \
              CODE_SIGNING_ALLOWED=NO \
              CONFIGURATION_BUILD_DIR="$PWD/output"
          elif [ -n "$PROJECT" ]; then
            echo "Using project: $PROJECT"
            xcodebuild \
              -project "$PROJECT"
